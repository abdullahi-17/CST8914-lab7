<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form Validation Feedback Form</title>
        <meta charset="utf-8">
        <style>.control, fieldset {
      margin: 6px 0;
    }
    
    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }
    
    input + label {
      width: auto;
    }
    
    .error, .required {
      color: red;
    }
    
    fieldset ul {
      margin: 0;
    }</style>
    </head>
    <body>
        <h1>Feedback form</h1>
    <!-- Added required field indicators -->
    <p>All fields are required. Select one gender option and accept the terms and conditions.</p>
    <!-- JavaScript now handles validation -->
    <form novalidate>
        <div class="control">
          <!-- Label is now connected to its control -->
          <label for="name">Full name (required)</label><input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="control">
          <!-- Added aria attributes for biography instructions -->
          <label for="biography">Biography (required)</label><textarea id="biography" name="biography" aria-describedby="biography_hint" required></textarea>
          <span id="biography_hint">Include examples on your skills in JavaScript.</span>
        </div>
        
          <!-- Gender field is grouped, arrows can be used to go to female option -->
          <fieldset>
          <legend>Gender (required)</legend>
          <div class="control">
            <input id="gender_male" name="gender" type="radio" value="male" required /><label for="gender_male">Male</label>
          </div>
          <div class="control">
            <input id="gender_female" name="gender" type="radio" value="female" required /><label for="gender_female">Female</label>
          </div>
        
        </fieldset>

        <div class="control">
          <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" required /><label for="accept_agbs">I accept the terms and conditions (required)</label>
        </div>
        <div class="control">
          <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
        </div>
      </form>
      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>
      "use strict";

      $(document).ready(function () {
        function validateInput(input, message) {
          var $input = $('[name="' + input + '"]');
          var missing;

          // Text fields and selected radio buttons or checkboxes are checked.
          if ($input.is(':radio') || $input.is(':checkbox')) {
            missing = $input.filter(':checked').length === 0;
          } else {
            missing = $input.val().trim() === '';
          }

          if (!missing) {
            return;
          }

          var $referencedElement = $input.first();
          // Each error now has a keyboard-accessible link and a unique ID.
          var $error = $('<a>', {
            href: '#' + $referencedElement.attr('id'),
            id: input + '_description',
            class: 'error',
            text: message
          });
          $error.on('click', function (event) {
            event.preventDefault();
            $referencedElement.focus();
          });

          // Error descriptions are added without removing the biography hint.
          $input.attr('aria-invalid', 'true');
          $input.each(function () {
            var description = $(this).attr('aria-describedby') || '';
            $(this).attr('aria-describedby', (description + ' ' + input + '_description').trim());
          });
          $('<li>').append($error).appendTo('#form-errors ul');
        }

        $('form').on('submit', function (event) {
          event.preventDefault();

          // Old errors and invalid states are now cleared before checking again.
          $('#form-errors').remove();
          $('[aria-invalid]').removeAttr('aria-invalid');
          $('#name, #gender_male, #gender_female, #accept_agbs').removeAttr('aria-describedby');
          $('#biography').attr('aria-describedby', 'biography_hint');

          // Error summary can receive focus but is outside the normal Tab order.
          $(this).prepend('<section id="form-errors" tabindex="-1" aria-labelledby="error-heading"><h2 id="error-heading">Please correct the following errors</h2><ul></ul></section>');

          validateInput('name', 'Please enter your name!');
          validateInput('biography', 'Please tell us something about your history!');
          validateInput('gender', 'Please tell us your gender!');
          validateInput('accept_agbs', 'You must accept our terms and conditions!');

          // Screen readers can now read the error summary and users can navigate to the first error using the keyboard.
          if ($('#form-errors .error').length > 0) {
            $('#form-errors').focus();
          } else {
            $('#form-errors').remove();
            alert('All inputs are valid.');
          }
        });
      });
          </script>
                
        </body>
      </html>
